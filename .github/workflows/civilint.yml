name: CiviCRM conventions

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  civilint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PHP and tools
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install civilint dependencies
        run: |
          git clone --depth 1 https://github.com/civicrm/civicrm-buildkit.git /opt/civicrm-buildkit
          cd /opt/civicrm-buildkit
          composer install --prefer-dist --no-interaction --no-progress

      - name: Automatically fix conventions
        run: |
          git ls-files '*.php' '*.js' '*.css' | /opt/civicrm-buildkit/bin/phpcbf - || test $? -le 1

      - name: Run civilint
        run: git ls-files '*.php' '*.js' '*.css' | /opt/civicrm-buildkit/bin/civilint -

      - name: Save fixed files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: civilint-fixes
          path: |
            CRM
            settings
            templates
            xml
            css
            *.php
          if-no-files-found: ignore
